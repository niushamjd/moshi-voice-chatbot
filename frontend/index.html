<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Moshi Voice Chatbot</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Moshi Voice Chatbot</h1>
    <p class="subtitle">Real-time full-duplex voice AI</p>

    <div class="status-ring" id="ring">
      <div class="pulse" id="pulse"></div>
    </div>

    <p class="status-text" id="statusText">Click to connect</p>

    <button id="connectBtn">Connect</button>
    <p class="stats" id="stats"></p>

    <div class="transcript" id="transcript">
      <p class="placeholder">Moshi&rsquo;s side of the conversation will appear here. Headphones work best.</p>
    </div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
