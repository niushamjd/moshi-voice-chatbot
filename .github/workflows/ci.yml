name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      - name: Validate Kubernetes manifests
        env:
          KUBECONFORM_VERSION: v0.8.0
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin kubeconform
          kubectl kustomize k8s | kubeconform -strict -summary

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest --junitxml=reports/junit.xml -o junit_family=xunit1
      - name: Upload JUnit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-py${{ matrix.python-version }}
          path: reports/junit.xml
          if-no-files-found: warn

  docker:
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/niushamjd/moshi-voice-chatbot
      # Only real pushes to main or a v* tag publish; PRs build and test only.
      PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: moshi:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: |
          docker run -d --name moshi -p 8998:8998 moshi:ci
          for _ in $(seq 30); do
            if curl -sf http://localhost:8998/healthz; then exit 0; fi
            sleep 1
          done
          echo "::error::container never answered /healthz"
          exit 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-server.txt

      - name: Smoke test the container
        run: python scripts/smoke_test.py --seconds 3

      - name: Image size
        run: |
          size=$(docker image inspect moshi:ci --format '{{.Size}}')
          echo "image size: $((size / 1000000)) MB" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Container logs
        if: ${{ always() }}
        run: docker logs moshi || true

      - name: Log in to ghcr.io
        if: ${{ env.PUBLISH == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: ${{ env.PUBLISH == 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  k8s-e2e:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: helm/kind-action@v1
        with:
          cluster_name: moshi

      # Same script as on a laptop: it reuses the cluster above, builds the
      # image, loads it into kind, applies k8s/ and waits for the rollout.
      - name: Deploy to kind
        run: ./scripts/kind-up.sh

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-server.txt

      - name: Smoke test through the Service
        run: |
          kubectl -n moshi port-forward svc/moshi 8998:80 > port-forward.log 2>&1 &
          for _ in $(seq 30); do
            if curl -sf http://localhost:8998/healthz; then break; fi
            sleep 1
          done
          python scripts/smoke_test.py --seconds 3

      - name: Dump cluster state
        if: ${{ failure() }}
        run: |
          kubectl -n moshi get all -o wide || true
          kubectl -n moshi describe deployment,pods || true
          kubectl -n moshi logs deployment/moshi --all-containers --tail=200 || true
          kubectl -n moshi logs deployment/moshi --all-containers --previous --tail=200 || true
          cat port-forward.log || true
