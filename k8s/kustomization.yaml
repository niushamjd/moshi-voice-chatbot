apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: moshi
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
# Applied as-is, this runs the image CI publishes from main. scripts/kind-up.sh
# (also used by the k8s-e2e CI job) overlays it to use a locally built image.
images:
  - name: ghcr.io/niushamjd/moshi-voice-chatbot
    newTag: latest
